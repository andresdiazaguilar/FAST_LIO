common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
    use_d2_outlier_filter: true  # Enable D^2-LIO adaptive per-point outlier threshold (Eq. 7) in place of FAST-LIO2's s>0.9 gate.
    d2_eps_min: 0.05              # Lower clamp on eps_j in meters (avoids collapse when the platform is near-static).
    d2_eps_max: 2.0               # Upper clamp on eps_j in meters (guards against runaway thresholds on bad motion estimates).

degeneracy:
    # Probabilistic degeneracy mitigation (Week 7).  When enabled, attenuates the
    # pose update along eigen-directions judged degenerate.
    # DRPM update rule: x = U P Lambda^-1 U^T J^T b, P = diag(p_1..p_6), p_k in [0,1].
    # With enable=false, the filter is byte-identical to baseline FAST-LIO2.
    enable: true
    force_all_probabilities_one: true  # true: force all p_k=1 while keeping mitigation path active for testing
    probability_mode: "probabilistic"   # "heuristic" | "probabilistic"
    heuristic_mode:   "soft"        # "hard" | "soft" | "sigmoid"
    # Hard-threshold mode: p_k = 1 if lambda_k > lambda_min else 0
    hard_lambda_min_trans: 100.0
    hard_lambda_min_rot:   100.0
    # Soft-threshold mode: p_k = lambda_k / (lambda_k + alpha)
    soft_alpha_trans:      100.0
    soft_alpha_rot:        100.0
    # Sigmoid mode:        p_k = sigmoid((lambda_k - tau) / s)
    sigmoid_tau_trans:     100.0
    sigmoid_tau_rot:       100.0
    sigmoid_s_trans:        50.0
    sigmoid_s_rot:          50.0
    # DRPM probabilistic mode (probability_mode: "probabilistic"):
    # Uses signal-to-noise ratio framework from Hatleskog & Alexis (arXiv:2410.10784).
    # Computes per-direction non-degeneracy probability via noise characterization.
    snr_factor:             10.0    # signal must be snr_factor x noise to be judged non-degenerate
    stdev_points:           0.02    # point measurement noise std dev [m] (from LiDAR datasheet)
    stdev_normals:          0.05    # normal estimation noise std dev [rad-equivalent]

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: true
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
